<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kavach Chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --border: #262c3a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --user-bubble: #24304a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  select {
    margin-left: auto;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.error { color: #ff8080; border-color: #5a2a2a; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { padding: 16px 20px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  #inputbar { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    font-family: inherit;
    min-height: 48px;
    max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.stop { background: #b34040; }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>Kavach Chat</h1>
  <select id="model"></select>
</header>
<div id="chat"></div>
<footer>
  <div id="inputbar">
    <textarea id="input" placeholder="Message Kavach… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
</footer>
<script>
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const modelEl = document.getElementById("model");

  let messages = [];
  let busy = false;
  let controller = null;

  async function loadModels() {
    try {
      const r = await fetch("/api/models");
      const data = await r.json();
      const names = (data.models || []).map((m) => m.name);
      if (!names.length) names.push("mistral");
      modelEl.innerHTML = names.map((n) => `<option>${n}</option>`).join("");
      if (names.includes("mistral")) modelEl.value = "mistral";
    } catch {
      modelEl.innerHTML = "<option>mistral</option>";
    }
  }

  function addBubble(role, text = "") {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    messages.push({ role: "user", content: text });
    addBubble("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";

    busy = true;
    sendBtn.textContent = "Stop";
    sendBtn.classList.add("stop");

    const bubble = addBubble("bot");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    bubble.appendChild(cursor);

    controller = new AbortController();
    let full = "";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelEl.value, messages, stream: true }),
        signal: controller.signal,
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const chunk = JSON.parse(line);
          if (chunk.error) throw new Error(chunk.error);
          if (chunk.message && chunk.message.content) {
            full += chunk.message.content;
            bubble.textContent = full;
            bubble.appendChild(cursor);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }
      }

      if (full) messages.push({ role: "assistant", content: full });
      else bubble.textContent = "(empty response)";
    } catch (err) {
      if (err.name !== "AbortError") {
        bubble.classList.add("error");
        bubble.textContent = err.message.includes("Failed to fetch")
          ? "Cannot reach Ollama. Is it running?"
          : err.message;
      }
      if (full) {
        messages.push({ role: "assistant", content: full });
      } else {
        messages.pop();
        bubble.remove();
      }
    } finally {
      cursor.remove();
      busy = false;
      controller = null;
      sendBtn.textContent = "Send";
      sendBtn.classList.remove("stop");
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", () => {
    if (busy && controller) controller.abort();
    else send();
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  loadModels();
  inputEl.focus();
</script>
</body>
</html>
